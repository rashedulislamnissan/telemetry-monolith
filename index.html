<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A sci-fi control room where every glowing dot is a real event from your own browser. Move, click, and hover a dot to read its raw data.">
  <meta name="author" content="Rashedul Islam Nissan">
  <title>Telemetry Monolith</title>
  <!-- Declaring the icon also stops browsers probing /favicon.ico (a 404 that would show up as a resource event). -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/logo-180.png">
  <!-- Link previews (absolute URLs are required by the Open Graph spec). -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Telemetry Monolith">
  <meta property="og:description" content="A sci-fi control room where every glowing dot is a real event from your own browser.">
  <meta property="og:url" content="https://rashedulislamnissan.github.io/telemetry-monolith/">
  <meta property="og:image" content="https://rashedulislamnissan.github.io/telemetry-monolith/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Telemetry Monolith: orbital rings around a hexagonal core, with labelled particles of real browser events.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="stage" role="img" aria-label="Animated instrument display of orbital rings around a hexagonal core, drawn from this page's own browser telemetry."></canvas>

  <!-- The 10 s reveal. data-self: the mutation source ignores everything in here. -->
  <section class="reveal" id="reveal" data-self aria-live="polite">
    <p class="reveal-caption">Every particle is a real browser event.</p>
    <p class="reveal-hint">Hover any particle to read its raw data.</p>
    <div class="stream" aria-hidden="true">
      <p class="stream-head">Raw event stream</p>
      <pre class="stream-body"></pre>
    </div>
  </section>

  <div class="tip" id="tip" data-self role="tooltip" hidden></div>

  <nav class="corner" aria-label="Page controls">
    <!-- data-self: its text changes because of us, so the mutation source ignores it. -->
    <button class="mute" id="mute" type="button" aria-pressed="true" aria-keyshortcuts="m" data-self>Sound on (M)</button>
    <a class="backlink" id="backlink" href="#">Portfolio</a>
  </nav>

  <div class="fallback" id="fallback" hidden>
    <p id="fallback-msg"></p>
  </div>

  <noscript>
    <div class="fallback"><p>This page draws live browser telemetry with JavaScript. Turn JavaScript on to see it.</p></div>
  </noscript>

  <script type="module" src="./js/main.js"></script>
  <!-- Browsers too old for ES modules run only this. -->
  <script nomodule>
    document.getElementById('fallback-msg').textContent = 'This page needs a browser with JavaScript modules. Try a current version of Chrome, Firefox or Safari.';
    document.getElementById('fallback').hidden = false;
  </script>
</body>
</html>
